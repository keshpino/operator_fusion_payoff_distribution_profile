[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keshpino-operator_fusion_payoff_distribution_profile"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别机器人运动控制工程师·算子融合的收益边界上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "keshpino" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://keshpino.github.io"
Repository = "https://github.com/keshpino/operator_fusion_payoff_distribution_profile"
Issues = "https://github.com/keshpino/operator_fusion_payoff_distribution_profile/issues"

[project.scripts]
operator_fusion_payoff_distribution_profile = "operator_fusion_payoff_distribution_profile:main"

[tool.setuptools]
py-modules = ["operator_fusion_payoff_distribution_profile"]
